<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="X-UA-Compatible" content="ie=edge" />
		<title>Airgapped QR Code Transfer</title>
		<link rel="stylesheet" href="vendor/app.css" />
	</head>

	<body>
		<div id="app">
			<div
				class="flex flex-col items-start w-full items-center justify-center align-middle"
			>
				<div class="flex flex-row gap-2 my-4">
					<div class="text-xl mb-4">Data Mode:</div>
					<button
						id="mode_sender_btn"
						class="mode-btn p-1 border-2 border-gray-500"
					>
						Sender
					</button>
					<button
						id="mode_receiver_btn"
						class="mode-btn p-1 border-2 border-gray-500"
					>
						Receiver
					</button>
				</div>

				<div
					id="sender_panel"
					class="flex flex-col items-center w-full"
				>
					<div id="sender_message" class="text-sm mb-4">
						Choose file to get started
					</div>
					<div class="w-1/2 mb-4">
						<input
							class="block w-full text-sm text-gray-900 border border-gray-300 cursor-pointer bg-gray-50 focus:outline-none"
							id="file_input"
							type="file"
						/>
					</div>
					<button
						id="transfer_btn"
						class="mb-6 p-1 border-2 border-gray-500"
					>
						Start Transfer
					</button>
					<div id="qrcode" class=""></div>
				</div>

				<div
					id="receiver_panel"
					class="flex flex-col items-center w-full"
					hidden
				>
					<div id="receiver_message" class="text-sm mb-4">
						Click receive button to start receiving
					</div>
					<div id="progress" class="text-sm mb-4">
						Progress: 0 / 0
					</div>
					<button
						id="receiver_btn"
						class="mb-6 p-1 border-2 border-gray-500"
					>
						Start Receiver
					</button>
					<video id="videoElement" muted autoplay playsinline></video>
				</div>
			</div>
		</div>
		<script src="vendor/qrcode.js"></script>
		<script src="vendor/zbar-wasm.js"></script>
		<script src="vendor/pako.min.js"></script>
		<script src="js/codec.js"></script>
		<script src="js/sender.js"></script>
		<script src="js/receiver.js"></script>
		<script src="js/app.js"></script>
	</body>
</html>
