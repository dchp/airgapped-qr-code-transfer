<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="X-UA-Compatible" content="ie=edge" />
		<title>Airgapped QR Code Transfer</title>
		<link rel="stylesheet" href="vendor/app.css" />
	</head>

	<body>
		<div id="app" class="container">
			<div
				class="flex flex-col items-start w-full items-center justify-center align-middle"
			>
				<div
					class="mode-switcher my-4"
					role="group"
					aria-label="Transfer mode"
				>
					<button
						type="button"
						id="mode_sender_btn"
						aria-pressed="true"
					>
						Sender Mode
					</button>
					<button
						type="button"
						id="mode_receiver_btn"
						aria-pressed="false"
					>
						Receiver Mode
					</button>
				</div>

				<div
					id="sender_panel"
					class="flex flex-col items-center w-full"
				>
					<div id="sender_message" class="text-sm mb-4">
						Choose file to get started
					</div>
					<div class="file-field mb-4">
						<input
							id="file_input"
							class="file-input-native"
							type="file"
						/>
						<label class="file-picker" for="file_input">
							<span class="file-picker-button">Choose file</span>
							<span class="file-picker-name" id="file_name"
								>No file chosen</span
							>
						</label>
					</div>
					<button
						type="button"
						id="transfer_btn"
						class="action-btn mb-6"
					>
						Start Transfer
					</button>
					<div id="qrcode"></div>
				</div>

				<div
					id="receiver_panel"
					class="flex flex-col items-center w-full"
					hidden
				>
					<div id="receiver_message" class="text-sm mb-4">
						Click receive button to start receiving
					</div>
					<div id="progress" class="text-sm mb-4">
						Progress: 0 / 0
					</div>
					<button
						type="button"
						id="receiver_btn"
						class="action-btn mb-6"
					>
						Start Receiver
					</button>
					<video id="videoElement" muted autoplay playsinline></video>
				</div>
			</div>
		</div>
		<script src="vendor/qrcode.js"></script>
		<script src="vendor/zbar-wasm.js"></script>
		<script src="vendor/pako.min.js"></script>
		<script src="js/codec.js"></script>
		<script src="js/sender.js"></script>
		<script src="js/receiver.js"></script>
		<script src="js/app.js"></script>
	</body>
</html>
