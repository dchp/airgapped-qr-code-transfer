<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body>
    <div id="app">
      <div
        class="flex flex-col items-start w-full items-center justify-center align-middle"
      >
        <div class="text-xl my-4">Data Receiver Mode</div>
        <div id="user_message" class="text-sm mb-4">Click receive button to start receiving</div>
        <div id="progress" class="text-sm mb-4">
          Progress: 0 /
          0
        </div>
        <button
          id="receiver_btn"
          class="mb-6 p-1 border-2 border-gray-500"
        >
          Start Receiver
        </button>
        <video id="videoElement" muted autoplay playsinline></video>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@latest/dist/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.0.3/pako.min.js"></script>
    <script>
      (() => {
          const user_message = document.getElementById("user_message");
          const progress = document.getElementById("progress");
          const receiver_btn = document.getElementById("receiver_btn");
          let decoded_chunks = {};
          const total_chunks = -1;
          let file_metadata = {};
          let is_receiving = false;
          let canvas, context, videoElement;

          const update_progress = () => {
            progress.textContent =
              `Progress: ${Object.keys(decoded_chunks).length} / ${file_metadata.chunks || 0}`;
          };

          const decode_data = (input_string) => {
            const encoded_data = atob(input_string.split(",")[1]);
            const encoded_array = Array.from(encoded_data, (char) =>
              char.charCodeAt(0)
            );
            const utf8Decoder = new TextDecoder();
            const output_string = utf8Decoder.decode(
              new Uint8Array(encoded_array)
            );
            const data_array = Array.from(output_string, (char) =>
              char.charCodeAt(0)
            );
            return {
              index: parseInt(input_string.split(",")[0]),
              data: data_array,
            };
          };

          const download_file = (data, fileName) => {
            const blob = new Blob([data]);
            const dummy_element = document.createElement("a");
            const url = URL.createObjectURL(blob);
            dummy_element.href = url;
            dummy_element.download = fileName;
            dummy_element.click();
            URL.revokeObjectURL(url);
          };

          const stop_receiver = () => {
            is_receiving = false;
            receiver_btn.textContent = "Start Receiver";
            decoded_chunks = {};
            Object.assign(file_metadata, {});
            update_progress();
            user_message.textContent = "Click receive button to start receiving";
          };

          const start_receiver = async () => {
            decoded_chunks = {};
            is_receiving = true;
            receiver_btn.textContent = "Stop Receiver";
            update_progress();
            while (
              file_metadata.chunks != Object.keys(decoded_chunks).length
            ) {
              try {
                await new Promise((r) => setTimeout(r, 10));
                context.drawImage(videoElement, 0, 0);
                image_data = context.getImageData(
                  0,
                  0,
                  canvas.width,
                  canvas.height
                );
                let symbols = await zbarWasm.scanImageData(image_data);
                if (!symbols || !symbols.length) {
                  continue;
                }
                let decoded_data = symbols[0].decode();
                if (decoded_data.includes("chunks")) {
                  Object.assign(file_metadata, JSON.parse(decoded_data));
                  decoded_chunks = {};
                  user_message.textContent = `Transferring file: ${file_metadata.name}`;
                  update_progress();
                } else if (decoded_data.split(",").length == 2) {
                  let raw_data = decode_data(decoded_data);
                  decoded_chunks[raw_data["index"]] = raw_data["data"];
                  update_progress();
                }
                window.decoded_chunks = decoded_chunks;
              } catch (error) {
                console.error("Error in Loop: ", error);
              }
              if (!is_receiving) {
                Object.assign(file_metadata, {});
                decoded_chunks = {};
                update_progress();
                user_message.textContent = "Click receive button to start receiving";
                return true;
              }
            }
            user_message.textContent = "Data Transfer Complete";
            output_array = [];
            for (let i = 0; i < file_metadata.chunks; i++) {
              output_array = output_array.concat(decoded_chunks[i]);
            }
            let output_unit8array = Uint8Array.from(output_array);
            window.output_unit8array = output_unit8array;
            let infalted_array = pako.inflate(window.output_unit8array);
            download_file(infalted_array, file_metadata.name);
            stop_receiver();
          };

          document.addEventListener("DOMContentLoaded", async () => {
            console.log("Application Initialized ...");
            videoElement = document.getElementById("videoElement");
            videoElement.srcObject = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: "environment" },
            });
            canvas = document.createElement("canvas");
            context = canvas.getContext("2d");
            await new Promise((r) => setTimeout(r, 2000));
            canvas.height = videoElement.videoHeight;
            canvas.width = videoElement.videoWidth;
            context.drawImage(videoElement, 0, 0);
            receiver_btn.addEventListener("click", () => {
              if (is_receiving) stop_receiver();
              else start_receiver();
            });
          });
      })();
    </script>
  </body>
</html>
